name: Validar acervo

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-acervo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do site
        uses: actions/checkout@v4
        with:
          path: imagens

      - name: Ler commit fixado do corpus
        id: corpus
        working-directory: imagens
        run: python -c 'import json; print("sha=" + json.load(open("editorial/publication.json"))["corpus_commit"])' >> "$GITHUB_OUTPUT"

      - name: Checkout público do corpus
        uses: actions/checkout@v4
        with:
          repository: anavvanzin/iconocracy-corpus
          ref: ${{ steps.corpus.outputs.sha }}
          path: iconocracy-corpus

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install "jsonschema==4.23.0"

      - name: Validar manifesto e reproduzir artefatos
        working-directory: imagens
        run: |
          python -c 'import json,jsonschema; jsonschema.validate(json.load(open("editorial/publication.json")),json.load(open("schemas/publication.schema.json")))'
          python scripts/corpus_sync.py --corpus ../iconocracy-corpus/corpus/corpus-data.json --out /tmp/iconocracia-generated
          diff -u site/data/acervo.json /tmp/iconocracia-generated/acervo.json
          diff -u site/data/stats.json /tmp/iconocracia-generated/stats.json
          diff -u site/data/constellations.json /tmp/iconocracia-generated/constellations.json

      - name: Validar imagens locais publicadas
        working-directory: imagens
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("site")
          missing = [item["imagem"] for item in json.load(open(root / "data/acervo.json")) if item.get("tem_imagem") and not item["imagem"].startswith(("http://", "https://")) and not (root / item["imagem"]).is_file()]
          if missing:
              raise SystemExit("Imagens locais ausentes: " + ", ".join(missing))
          PY

      - name: Testar pipeline
        working-directory: imagens
        run: python -m unittest discover -s tests -v

      - name: Diagnóstico separado de links externos
        continue-on-error: true
        working-directory: imagens
        run: python scripts/validate_acervo.py --json editorial/publication.json --schema schemas/publication.schema.json --report acervo-validation-report.md --retries 0 --timeout 8
