name: Conflict markers

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject unresolved merge conflicts
        shell: bash
        run: |
          if git grep -nI -E '^(<{7}|={7}$|>{7}|\|{7})' -- .; then
            echo "::error::Unresolved merge-conflict marker found."
            exit 1
          fi

  acervo-route:
    name: Acervo route regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test acervo routes
        run: node --test tests/test_acervo_route.mjs

  acervo-golden:
    name: Acervo production golden
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test production data snapshot
        run: python -m unittest discover -s tests -p 'test_build_data_golden.py' -v
